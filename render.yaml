services:
  - type: web
    name: nerdcastfinder-backend
    env: python
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements-prod.txt"
    # Use uvicorn directly to avoid WSGI/ASGI worker mismatches on some platforms
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT --log-level info --workers 1"
    envVars:
      - key: PYTHON_VERSION
        value: '3.11'
      - key: FAISS_INDEX_PATH
        value: ''
      - key: BACKEND_URL
        value: ''
      - key: LOG_LEVEL
        value: 'INFO'
      - key: CORS_ALLOW_ORIGINS
        value: ''
